    :root {

      --line: #e4dccf;
      --paper: #f6f1e8;
      --sheet: #fffdf9;
      --go: #b85a28;
      --go-deep: #8a3e16;
      --backup: #2f5d73;
      --skip: #8a847a;
      --start: #1f6b52;
      --shadow: 0 10px 30px rgba(28, 25, 21, 0.16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    #map { position: fixed; inset: 0; }
    .top {
      position: fixed;
      z-index: 500;
      top: calc(10px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      pointer-events: none;
    }
    .start-card, .locate {
      pointer-events: auto;
      background: var(--sheet);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .start-card {
      flex: 1;
      border-radius: 16px;
      padding: 10px 12px;
    }
    .start-card p {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--start);
      font-weight: 700;
    }
    .start-card strong {
      display: block;
      margin-top: 2px;
      font-size: 15px;
      line-height: 1.25;
    }
    .start-card span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }
    .locate {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      font-size: 12px;
      color: var(--start);
    }
    .sheet {
      position: fixed;
      z-index: 600;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 52%;
      background: var(--sheet);
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -8px 30px rgba(28, 25, 21, 0.14);
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.open { max-height: 74%; }
    .grab {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: #d9d0c3;
      margin: 8px auto 6px;
    }
    .sheet-head { padding: 0 16px 8px; }
    .sheet-head h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .sheet-head p {
      margin: 4px 0 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .filters { display: flex; gap: 6px; overflow-x: auto; }
    .filters button, .actions button, .back {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    .filters button {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 650;
    }
    .filters button.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .list, .detail {
      overflow: auto;
      padding: 4px 12px 16px;
    }
    .card {
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0;
      margin-bottom: 8px;
      position: relative;
    }
    .go-maps {
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px 12px 34px;
    }
    .card.go { border-color: #efd3c4; }
    .km {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .km small {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 650;
      color: var(--muted);
    }
    .card h2 { margin: 0; font-size: 15px; line-height: 1.25; }
    .card .meta, .detail .meta {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--go-deep);
    }
    .tag.backup { color: var(--backup); }
    .tag.skip { color: var(--skip); }
    .today {
      display: inline-block;
      margin-left: 6px;
      background: #f3d48a;
      color: #5c3b00;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .pin.fresh { box-shadow: 0 0 0 3px #e2a317, 0 4px 10px rgba(0,0,0,.25); }
    .card { position: relative; }
    .info {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 10px;
    }
    .detail h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.15; }
    .detail .lead {
      font-size: 16px;
      margin: 8px 0;
      line-height: 1.35;
    }
    .detail .note {
      background: #f7f3ec;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 10px;
    }
    .addr {
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions button, .back {
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 700;
    }
    .actions .primary {
      background: var(--start);
      color: #fff;
      border-color: var(--start);
      grid-column: 1 / -1;
    }
    .back {
      margin-bottom: 10px;
      padding: 8px 12px;
    }
    .toast {
      position: fixed;
      z-index: 800;
      left: 50%;
      bottom: calc(62% + 8px);
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s linear;
    }
    .toast.show { opacity: 1; }
    .pin-wrap { background: none; border: none; }
    .pin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,.25);
    }

      font-size: 11px;
      font-weight: 800;

    .pin.go { background: var(--go); }
    .pin.backup { background: var(--backup); }
    .pin.skip { background: var(--skip); }
    .pin.on { outline: 3px solid var(--ink); }

      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--start);
      border: 3px solid #fff;

  </style>
</head>

    function kmBetween(a, b) {
      const R = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const la1 = a.lat * Math.PI / 180;
      const la2 = b.lat * Math.PI / 180;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    PLACES.forEach((p) => {
      if (p.lat != null) {
        p.km = kmBetween(OFFICE, p);
        p.walkMin = Math.max(6, Math.round(p.km * 1.35 / 4.6 * 60));
      } else {
        p.km = 99;
        p.walkMin = null;
        p.noPin = true;
      }
    });

    const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([OFFICE.lat, OFFICE.lng], 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.circle([OFFICE.lat, OFFICE.lng], {
      radius: 1000, color: "#1f6b52", weight: 1.5, fillOpacity: 0.04
    }).addTo(map);
    L.circle([OFFICE.lat, OFFICE.lng], {
      radius: 3000, color: "#8a847a", weight: 1, dashArray: "6 6", fillOpacity: 0
    }).addTo(map);
    L.marker([OFFICE.lat, OFFICE.lng], {
      icon: L.divIcon({
        className: "pin-wrap",
        html: '<div class="start-pin"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      }),
      zIndexOffset: 1000,
      title: "Zoomcar"
    }).addTo(map).bindTooltip("Zoomcar · start here", { direction: "top", offset: [0, -8] });

    let filter = "near";
    let selected = null;
    let routeLine = null;
    let you = null;
    const markers = new Map();

    function visible() {
      return PLACES
        .filter((p) => p.noPin || p.km <= 3.05)
        .filter((p) => {
          if (filter === "today") return !!p.fresh;
          if (filter === "all") return true;
          if (filter === "best") return p.tier === "go";
          return p.tier !== "skip";
        })
        .sort((a, b) => (a.noPin === b.noPin ? a.km - b.km : a.noPin ? 1 : -1));
    }

    function pinIcon(p, on) {
      return L.divIcon({
        className: "pin-wrap",
        html: `<div class="pin ${p.tier} ${p.fresh ? "fresh" : ""} ${on ? "on" : ""}"><b>${p.km.toFixed(1)}</b></div>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });
    }

    function drawMarkers() {
      const show = new Set(visible().filter((p) => !p.noPin).map((p) => p.id));
      PLACES.forEach((p) => {
        if (p.noPin) return;
        if (!show.has(p.id)) {
          if (markers.has(p.id)) {
            map.removeLayer(markers.get(p.id));
            markers.delete(p.id);
          }
          return;
        }
        const icon = pinIcon(p, selected && selected.id === p.id);
        if (markers.has(p.id)) {
          markers.get(p.id).setIcon(icon);
        } else {
          const marker = L.marker([p.lat, p.lng], { icon, title: p.name }).addTo(map);
          marker.on("click", () => openMaps(p));
          markers.set(p.id, marker);
        }
      });
    }

    function tag(p) {
      if (p.fresh && p.tier === "go") return ["New today, strong reviews", ""];
      if (p.fresh) return ["New today", "backup"];
      if (p.tier === "go") return ["Room from the call", ""];
      if (p.tier === "backup") return ["Call again, still close", "backup"];
      return ["Ruled out for now", "skip"];
    }

    function renderList() {
      const rows = visible();
      const title = document.getElementById("listTitle");
      const sub = document.getElementById("listSub");
      title.textContent = filter === "today"
        ? "Found today, 10 Oct"
        : filter === "best"
          ? "Rooms you can still take"
          : filter === "near"
            ? "Nearest places worth a look"
            : "Everything inside 3 km";
      sub.textContent = rows.length + " places. Tap a name or a pin to open Google Maps. Gold ring means found today.";
      const list = document.getElementById("list");
      list.innerHTML = rows.map((p) => {
        const [label, cls] = tag(p);
        const dist = p.noPin ? "Maps" : p.km.toFixed(1) + " km";
        const walk = p.noPin ? "Tap for Google Maps" : p.walkMin + " min walk";
        const badge = p.fresh ? '<span class="today">Found 10 Oct</span>' : "";
        return `<div class="card ${p.tier}">
          <button class="go-maps" type="button" data-maps="${p.id}">
            <div class="km">${dist}<small>${walk}</small></div>
            <div>
              <h2>${p.name}${badge}</h2>
              <p class="meta">${p.offer}</p>
              <span class="tag ${cls}">${label}</span>
            </div>
          </button>
          <button class="info" type="button" data-info="${p.id}">Details</button>
        </div>`;
      }).join("");
    }

    function setFilter(next) {
      filter = next;
      ["today", "best", "near", "all"].forEach((id) => {
        document.getElementById("f-" + id).classList.toggle("on", id === next);
      });
      if (selected && !visible().some((p) => p.id === selected.id)) closeDetail();
      drawMarkers();
      renderList();
    }

    async function drawRoute(p) {
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      if (p.noPin) return;
      const url = `https://router.project-osrm.org/route/v1/foot/${OFFICE.lng},${OFFICE.lat};${p.lng},${p.lat}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const coords = data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
        const metres = data.routes[0].distance;
        const mins = Math.max(6, Math.round(metres / 1000 / 4.6 * 60));
        routeLine = L.polyline(coords, { color: "#1f6b52", weight: 5, opacity: 0.9 }).addTo(map);
        const walk = document.getElementById("walkLine");
        if (walk) walk.textContent = (metres / 1000).toFixed(1) + " km on foot · about " + mins + " min from Tower B";
        map.fitBounds(routeLine.getBounds(), { paddingTopLeft: [20, 90], paddingBottomRight: [20, 280] });
      } catch (err) {
        routeLine = L.polyline([[OFFICE.lat, OFFICE.lng], [p.lat, p.lng]], {
          color: "#1f6b52", weight: 4, dashArray: "8 8"
        }).addTo(map);
      }
    }

    function mapsLink(p) {
      const dest = p.noPin ? encodeURIComponent(p.name + ", " + p.address) : `${p.lat},${p.lng}`;
      const mode = !p.noPin && p.km < 1.4 ? "walking" : "driving";
      return `https://www.google.com/maps/dir/?api=1&origin=${OFFICE.lat},${OFFICE.lng}&destination=${dest}&travelmode=${mode}`;
    }

    function openMaps(p) {
      window.location.href = mapsLink(p);
    }

    function uberLink(p) {
      const pickup = `pickup[latitude]=${OFFICE.lat}&pickup[longitude]=${OFFICE.lng}&pickup[nickname]=${encodeURIComponent("Zoomcar Diamond District")}&pickup[formatted_address]=${encodeURIComponent(OFFICE.address)}`;
      if (p.noPin) {
        return `https://m.uber.com/ul/?action=setPickup&${pickup}&dropoff[formatted_address]=${encodeURIComponent(p.address)}&dropoff[nickname]=${encodeURIComponent(p.name)}`;
      }
      return `https://m.uber.com/ul/?action=setPickup&${pickup}&dropoff[latitude]=${p.lat}&dropoff[longitude]=${p.lng}&dropoff[nickname]=${encodeURIComponent(p.name)}&dropoff[formatted_address]=${encodeURIComponent(p.address)}`;
    }

    function copyBlock(p) {
      const pin = p.noPin ? "" : `\n${p.lat}, ${p.lng}`;
      return `${p.name}\n${p.address}${pin}`;
    }

    function openDetail(id) {
      const p = PLACES.find((item) => item.id === id);
      selected = p;
      document.getElementById("sheet").classList.add("open");
      document.getElementById("listView").hidden = true;
      const detail = document.getElementById("detail");
      detail.hidden = false;
      const dist = p.noPin ? "Address only" : p.km.toFixed(1) + " km from Zoomcar";
      const walk = p.walkMin ? `About ${p.walkMin} min on foot` : "Use Uber with the address";
      detail.innerHTML = `
        <button class="back" type="button" id="back">Back to list</button>
        <h2>${p.name}</h2>
        <p class="meta" id="walkLine">${dist} · ${walk} · ${p.area}</p>
        <p class="lead">${p.offer}</p>
        <p class="note">${p.why}</p>
        <p class="note">${p.caution}</p>
        <p class="addr">${p.address}</p>
        <div class="actions">
          <button class="primary" type="button" id="mapsBtn">Open in Google Maps</button>
          <button type="button" id="copyBtn">Copy address for Uber</button>
          <button type="button" id="uberBtn">Open Uber</button>
          ${p.tel ? `<button type="button" id="callBtn">Call ${p.phone}</button>` : ""}
        </div>`;
      document.getElementById("back").onclick = closeDetail;
      document.getElementById("mapsBtn").onclick = () => openMaps(p);
      document.getElementById("copyBtn").onclick = async () => {
        const text = copyBlock(p);
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          const area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1600);
      };
      document.getElementById("uberBtn").onclick = () => window.open(uberLink(p), "_blank");
      const call = document.getElementById("callBtn");
      if (call) call.onclick = () => { window.location.href = "tel:" + p.tel; };
      drawMarkers();
      if (!p.noPin) {
        map.panTo([p.lat, p.lng]);
        drawRoute(p);
      }
    }

    function closeDetail() {
      selected = null;
      document.getElementById("sheet").classList.remove("open");
      document.getElementById("detail").hidden = true;
      document.getElementById("listView").hidden = false;
      if (routeLine) {
        map.removeLayer(routeLine);
        routeLine = null;
      }
      drawMarkers();
      map.setView([OFFICE.lat, OFFICE.lng], 15);
    }

    document.getElementById("list").addEventListener("click", (event) => {
      const info = event.target.closest("[data-info]");
      const maps = event.target.closest("[data-maps]");
      if (info) openDetail(info.dataset.info);
      else if (maps) openMaps(PLACES.find((item) => item.id === maps.dataset.maps));
    });
    document.getElementById("f-today").onclick = () => setFilter("today");
    document.getElementById("f-best").onclick = () => setFilter("best");
    document.getElementById("f-near").onclick = () => setFilter("near");
    document.getElementById("f-all").onclick = () => setFilter("all");
    document.getElementById("locate").onclick = () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition((pos) => {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        if (you) map.removeLayer(you);
        you = L.circleMarker(latlng, { radius: 8, color: "#1d4e89", fillColor: "#3b82f6", fillOpacity: 1, weight: 2 }).addTo(map);
        map.setView(latlng, 16);
      }, () => {
        const toast = document.getElementById("toast");
        toast.textContent = "Location is off. You can still start from the Zoomcar pin.";
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
          toast.textContent = "Copied. Paste it into Uber.";
        }, 1800);
      }, { enableHighAccuracy: true, timeout: 8000 });
    };

    setFilter("near");
    setTimeout(() => map.invalidateSize(), 200);
